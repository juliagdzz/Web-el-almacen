<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <!-- Corcho con fotos y una chapa sobre fondo oliva: tarjeta de «Tableros» -->
  <rect width="1200" height="1200" fill="#9B9A3A"/>
  <rect x="250" y="300" width="700" height="560" rx="14" fill="#C49A64"/>
  <g fill="#B5874F">
    <circle cx="330" cy="380" r="5"/><circle cx="420" cy="760" r="5"/><circle cx="880" cy="420" r="5"/><circle cx="640" cy="810" r="5"/><circle cx="560" cy="350" r="5"/><circle cx="860" cy="790" r="5"/>
  </g>
  <!-- polaroid terracota -->
  <g transform="rotate(-6 450 540)">
    <rect x="320" y="380" width="250" height="300" fill="#FFFDF7"/>
    <rect x="338" y="398" width="214" height="214" fill="#B5532C"/>
    <ellipse cx="445" cy="560" rx="60" ry="18" fill="#C86A3E"/>
    <rect x="390" y="470" width="110" height="90" fill="#C86A3E"/>
  </g>
  <circle cx="445" cy="388" r="16" fill="#4A5A23"/>
  <!-- polaroid granate -->
  <g transform="rotate(5 740 560)">
    <rect x="620" y="420" width="240" height="280" fill="#FFFDF7"/>
    <rect x="637" y="437" width="206" height="200" fill="#551C25"/>
    <circle cx="740" cy="540" r="55" fill="#7A2C38"/>
  </g>
  <circle cx="742" cy="428" r="16" fill="#B85A2B"/>
  <!-- chapa de esmalte -->
  <circle cx="610" cy="760" r="62" fill="#FFFDF7"/>
  <circle cx="610" cy="760" r="52" fill="#6A8DC4"/>
</svg>
