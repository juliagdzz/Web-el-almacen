  <main id="app" class="contenedor piezas"></main>

  <!-- Elegir un esmalte de Prodesco -->
  <dialog id="hoja-prodesco" class="hoja">
    <form method="dialog" class="hoja-cierre"><button class="icono" aria-label="Cerrar">✕</button></form>
    <h2>Esmalte de Prodesco</h2>
    <input id="buscar-prodesco" type="search" placeholder="Número o nombre: 5546, azul…" autocomplete="off" aria-label="Buscar esmalte">
    <p id="cuenta-prodesco" class="cuenta">Cargando el catálogo…</p>
    <div id="lista-prodesco" class="rejilla-prodesco"></div>
  </dialog>

  <!-- Elegir una receta propia -->
  <dialog id="hoja-recetas" class="hoja">
    <form method="dialog" class="hoja-cierre"><button class="icono" aria-label="Cerrar">✕</button></form>
    <h2>Mis esmaltes</h2>
    <div id="lista-recetas-elegir" class="lista-elegir"></div>
  </dialog>

  <!-- Ficha para ver una pieza o una receta -->
  <dialog id="hoja-ver" class="hoja hoja-ver"></dialog>

  <div id="aviso" class="toast" role="status" aria-live="polite"></div>

  <script src="compartir.js"></script>
  <script src="editor-fotos.js"></script>
